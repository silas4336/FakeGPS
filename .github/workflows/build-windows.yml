name: build-windows

# 在 GitHub 的 Windows runner 上用 PyInstaller 把跨平台版打包成單一 .exe。
# 手動觸發（Actions 分頁按 Run workflow），或打 v* tag 時自動建並附到 Release。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyinstaller pymobiledevice3
      - name: Build exe
        run: >
          pyinstaller --onefile --name FakeGPS
          --add-data "crossplatform/index.html;."
          --collect-all pymobiledevice3
          crossplatform/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-windows
          path: dist/FakeGPS.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FakeGPS.exe
